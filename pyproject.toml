[project]
name = "vibe-ops-center"
version = "1.0.0"
description = "Terminal-based operations dashboard for AI infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.3",
    "textual-plotext>=1.0.1",
    "aiohttp>=3.13.5",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "aioresponses>=0.7.8",
    "ruff==0.16.4",
    "pip-audit==2.10.0",
    "pre-commit==4.5.1",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "actions",
    "checker",
    "config_manager",
    "log_config",
    "main",
    "platform_utils",
    "resilience",
    "screens",
    "storage",
]

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
